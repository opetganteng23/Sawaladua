name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pemindaian secret
        run: npm run scan:secrets
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & integration tests (server: MongoDB in-memory, web: jsdom)
        run: npm test
      - name: Laporan keselamatan (agregat, wajib ditinjau manusia)
        run: npm run eval:safety
      - name: Build (web + server)
        run: npm run build
      - name: Dependency audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (desktop + mobile)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/.results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: server/eval/reports/safety-latest.json
          if-no-files-found: ignore
