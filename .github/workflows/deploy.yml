name: Deploy

# Manual (workflow_dispatch) agar rilis selalu disengaja. Untuk production, aktifkan "Required reviewers" pada
# GitHub Environment `production` (Settings > Environments) sehingga ada persetujuan sebelum job deploy berjalan.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Branch atau tag yang dideploy
        default: main

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # Secret per-environment: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS. Variable: APP_URL (mis. https://sawala.contoh.id)
    steps:
      - name: Validasi input
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "ref tidak valid"; exit 1; }

      - name: Siapkan SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy lewat SSH (migrasi, reload PM2, smoke test, rollback otomatis)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/sawala && bash scripts/deploy.sh '$TARGET' '$REF'"

      - name: Smoke test dari luar
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$APP_URL/healthz" | grep -q '"ok":true' && echo OK && exit 0
            sleep 3
          done
          echo "healthz gagal dari luar (cek Nginx/TLS/firewall)"; exit 1
